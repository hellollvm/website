    [languages.en.params]
      description = "Tech events and blog of the HelloLLVM community"
      tagline = "Compilers · LLVM · MLIR · Open Source"
      homeIntro = "HelloLLVM is an open-source community for compiler developers and enthusiasts. We host meetups, tech talks and workshops — online and offline — around LLVM, MLIR, GCC, RISC-V and beyond."
      aboutText = "The HelloLLVM community was founded in May 2018 by LLVM developers from the original HelloGCC community. Since 2019 it has merged with the OSDT community (formerly HelloGCC), jointly running HelloGCC.org and HelloLLVM.org. Dr. Ji Qiu has been serving as the community chair since February 2023."
      joinText = "Join our offline meetups, subscribe to the mailing list, or follow us on GitHub. Whether you are a compiler veteran or just getting started — you are welcome."
