    [languages.zh.params]
      description = "HelloLLVM 社区技术活动与博客"
      tagline = "编译器 · LLVM · MLIR · 开源"
      homeIntro = "HelloLLVM 是一个面向编译器开发者与爱好者的开源技术社区。我们在线下与线上举办 Meetup、技术分享与培训，围绕 LLVM、MLIR、GCC、RISC-V 等话题一起交流成长。"
      aboutText = "HelloLLVM 社区成立于 2018 年 5 月，由原 HelloGCC 社区中从事 LLVM 研究和开发的技术爱好者组成。2019 年起与 OSDT 社区（原 HelloGCC 社区）合并，共同运营 HelloGCC.org 与 HelloLLVM.org。自 2023 年 2 月起，邱吉博士担任社区负责人。"
      joinText = "欢迎参加我们的线下 Meetup、订阅邮件列表，或在 GitHub 上关注我们。无论你是编译器老兵还是刚入门的新朋友，都欢迎来聊聊。"
